<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - نشر المقالات والمقارنات</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; margin: 0; padding: 20px; direction: rtl; }
        
        #loginBox { max-width: 400px; margin: 80px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        #loginBox h3 { color: #007bff; margin-top: 0; }
        #loginBox input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; text-align: center; }
        #loginBox button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
        #loginError { color: red; font-size: 14px; margin-top: 10px; display: none; }

        #adminPanel { display: none; max-width: 750px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #007bff; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #333; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; }
        .app-block { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px dashed #007bff; margin-top: 15px; }
        .app-block h4 { margin: 0 0 10px; color: #007bff; }
        .submit-btn { width: 100%; padding: 14px; background: #28a745; color: white; border: none; border-radius: 6px; font-size: 17px; margin-top: 20px; cursor: pointer; font-weight: bold; }
        .add-app-btn { width: 100%; padding: 10px; background: #17a2b8; color: white; border: none; border-radius: 6px; margin-top: 15px; cursor: pointer; font-weight: bold; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div id="loginBox">
    <h3>لوحة تحكم إيموشا أبس</h3>
    <p>أدخل كلمة المرور للمتابعة:</p>
    <input type="password" id="passInput" placeholder="كلمة المرور">
    <button onclick="checkPassword()">دخول</button>
    <div id="loginError">كلمة المرور غير صحيحة!</div>
</div>

<div id="adminPanel">
    <h2>نشر مقال / مقارنة تطبيقات جديدة</h2>
    <form id="articleForm">
        <label>عنوان المقال الرئيسي:</label>
        <input type="text" id="articleTitle" placeholder="اكتب عنوان المقال هنا..." required>

        <label>صورة الغلاف للمقال (رابط الصورة):</label>
        <input type="text" id="articleCover" placeholder="https://example.com/cover.jpg">

        <label>التصنيف:</label>
        <select id="articleCategory">
            <option value="تطبيقات المونتاج والتصميم">تطبيقات المونتاج والتصميم</option>
            <option value="أدوات الذكاء الاصطناعي">أدوات الذكاء الاصطناعي</option>
            <option value="تطبيقات الإنتاجية">تطبيقات الإنتاجية</option>
            <option value="مقارنات ومراجعات">مقارنات ومراجعات</option>
        </select>

        <label>مقدمة المقال (تمهيد للمقارنة):</label>
        <textarea id="articleIntro" rows="3" placeholder="اكتب مقدمة المقال هنا..." required></textarea>

        <div id="appsContainer"></div>

        <button type="button" class="add-app-btn" onclick="addAppBlock()">+ إضافة تطبيق آخر للمقارنة</button>

        <label>خاتمة المقال / الخلاصة والتوصية النهائية:</label>
        <textarea id="articleOutro" rows="3" placeholder="اكتب الخلاصة والتوصية هنا..."></textarea>

        <button type="submit" class="submit-btn">نشر المقال بالكامل</button>
    </form>
    <div id="status"></div>
</div>

<script>
    const SECRET_PASSWORD = "emosha2026";

    function checkPassword() {
        const input = document.getElementById("passInput").value;
        if (input === SECRET_PASSWORD) {
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("adminPanel").style.display = "block";
        } else {
            document.getElementById("loginError").style.display = "block";
        }
    }

    // تنظيف شامل للرابط واستخراج الرابط الصحيح لجوجل بلاي تلقائياً
    function cleanUrl(url) {
        if (!url) return "";
        // إزالة أي أقواس ومسافات وعلامات تنصيص
        let clean = url.replace(/[\[\]\(\)\`\'\"\s]/g, "").trim();
        return clean;
    }

    let appCount = 0;

    function addAppBlock() {
        appCount++;
        const container = document.getElementById("appsContainer");
        const div = document.createElement("div");
        div.className = "app-block";
        div.innerHTML = `
            <h4>التطبيق رقم ${appCount}</h4>
            <label>اسم التطبيق:</label>
            <input type="text" class="app-name" placeholder="مثال: CapCut" required>

            <label>أيقونة التطبيق (رابط صورة):</label>
            <input type="text" class="app-icon" placeholder="https://example.com/icon.png">

            <label>شرح ومميزات التطبيق:</label>
            <textarea class="app-desc" rows="3" placeholder="اكتب مميزات وشرح التطبيق..."></textarea>

            <label>رابط التحميل المباشر من جوجل بلاي:</label>
            <input type="text" class="app-link" placeholder="https://play.google.com/store/apps/details?id=..." required>
        `;
        container.appendChild(div);
    }

    addAppBlock();

    const dbUrl = "https://emosha-apps-default-rtdb.firebaseio.com/articles.json";

    document.getElementById("articleForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const statusDiv = document.getElementById("status");
        statusDiv.style.color = "blue";
        statusDiv.innerText = "جاري نشر المقال...";

        const appBlocks = document.querySelectorAll(".app-block");
        const appsList = [];

        appBlocks.forEach(block => {
            appsList.push({
                name: block.querySelector(".app-name").value,
                icon: cleanUrl(block.querySelector(".app-icon").value),
                desc: block.querySelector(".app-desc").value,
                link: cleanUrl(block.querySelector(".app-link").value)
            });
        });

        const articleData = {
            title: document.getElementById("articleTitle").value,
            cover: cleanUrl(document.getElementById("articleCover").value),
            category: document.getElementById("articleCategory").value,
            intro: document.getElementById("articleIntro").value,
            apps: appsList,
            outro: document.getElementById("articleOutro").value,
            date: new Date().toLocaleDateString('ar-EG')
        };

        fetch(dbUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(articleData)
        })
        .then(response => response.json())
        .then(data => {
            statusDiv.style.color = "green";
            statusDiv.innerText = "تم نشر المقال والمقارنة بنجاح!";
            document.getElementById("articleForm").reset();
            document.getElementById("appsContainer").innerHTML = "";
            appCount = 0;
            addAppBlock();
        })
        .catch(error => {
            statusDiv.style.color = "red";
            statusDiv.innerText = "حدث خطأ أثناء النشر!";
            console.error(error);
        });
    });
</script>

</body>
</html>
