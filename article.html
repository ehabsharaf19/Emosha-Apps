<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض المقال</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            margin: 0;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        /* تنسيق أزرار التنقل السليمة */
        .article-navigation-buttons {
            margin: 30px 0 20px 0;
            text-align: center;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .article-navigation-buttons a {
            display: inline-block;
            padding: 12px 25px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            margin: 5px 10px;
            transition: background 0.3s;
        }
        .btn-home {
            background-color: #007bff;
            color: #fff;
        }
        .btn-home:hover {
            background-color: #0056b3;
        }
        .btn-back {
            background-color: #e9ecef;
            color: #333;
        }
        .btn-back:hover {
            background-color: #dde2e6;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- مكان محتوى المقال وعنوانه -->
        <div id="article-content">
            <h1 id="article-title">عنوان المقال</h1>
            <div id="article-body">
                <!-- محتوى المقال والتطبيقات بيظهر هنا تلقائياً -->
            </div>
        </div>

        <!-- أزرار الرجوع والتنقل السليمة والمباشرة -->
        <div class="article-navigation-buttons">
            <a href="index.html" class="btn-home">🏠 الصفحة الرئيسية</a>
            <a href="javascript:history.back();" class="btn-back">⬅ العودة للصفحة السابقة</a>
        </div>
    </div>

</body>
</html>
